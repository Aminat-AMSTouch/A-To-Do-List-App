<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TO-DO LIST APP</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    
    <main class="app">
      <h1>My To-Do List</h1>

      <div class="input-row">
        <input type="text" id="userInput" placeholder="Add a task..." />
        <button onclick="addItem()">Add</button>
      </div>

      <div id="display"></div>

      <div class="actions">
        <button class="secondary" onclick="deleteLast()">Delete last</button>
        <button class="danger" onclick="deleteAllItem()">Delete all</button>
      </div>
    </main>

  

    <script src="script.js"></script>
</body>
</html>
